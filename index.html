<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f5c63">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Exam Practice"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Exam Practice</title>
<style>
:root{--bg:#f6f8f8;--fg:#14201f;--card:#fff;--line:#c9d6d5;--pri:#0f5c63;--on:#fff;--ok:#16794a;--okb:#dff3e8;--bad:#b3261e;--badb:#fbe3e1;--mut:#4d605f;--fs:18px}
@media(prefers-color-scheme:dark){:root{--bg:#101616;--fg:#eef4f3;--card:#192222;--line:#344645;--pri:#5fc2c9;--on:#062326;--ok:#6fdc9f;--okb:#17352a;--bad:#ff8a80;--badb:#3d1c1a;--mut:#a9bcbb}}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:1rem 1rem 5.5rem}
main{max-width:640px;margin:0 auto}
h1{font-size:1.4rem;margin:.2rem 0 1rem}
label{display:block;margin:1rem 0 .3rem;font-weight:600}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:.7rem;border:2px solid var(--line);border-radius:.6rem;background:var(--card)}
button{min-height:3rem;padding:.6rem 1rem;border:2px solid var(--line);border-radius:.6rem;background:var(--card);cursor:pointer}
button:disabled{opacity:.4}
.pri{background:var(--pri);color:var(--on);border-color:var(--pri);font-weight:700}
.full{width:100%;margin-top:1rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:.8rem;padding:1rem;margin:.8rem 0}
.opt{display:block;width:100%;text-align:left;margin:.6rem 0}
.sel{border-color:var(--pri);background:var(--pri);color:var(--on)}
.ok{border-color:var(--ok);background:var(--okb);color:var(--fg)}
.bad{border-color:var(--bad);background:var(--badb);color:var(--fg)}
.en{color:var(--mut);margin-top:.35rem}
.sel .en{color:var(--on)}
.m{color:var(--mut);margin:.2rem 0}
.row{display:flex;gap:.6rem;margin-top:1rem}.row>*{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;min-height:3.6rem;background:none}
nav .on{color:var(--pri);font-weight:700;box-shadow:inset 0 3px var(--pri)}
.big{font-size:2.4rem;font-weight:700}
</style></head><body><main id="app"></main><div id="nv"></div>
<script>
const app=document.getElementById('app'),$=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem('ep'))}catch(e){}
S=S||{subs:{},cfg:{model:'anthropic/claude-sonnet-4.5',fs:18,key:''}};
const save=()=>localStorage.setItem('ep',JSON.stringify(S));
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fs=()=>document.documentElement.style.setProperty('--fs',S.cfg.fs+'px');fs();
let V='exsub',D=null,Q=null,Sub='';
const BUILD='20261009090918';
(async()=>{try{
 if('serviceWorker' in navigator)(await navigator.serviceWorker.getRegistrations()).forEach(r=>r.unregister());
 if(window.caches)(await caches.keys()).forEach(k=>caches.delete(k));
 const t=await (await fetch(location.pathname+'?nc='+Date.now(),{cache:'no-store'})).text();
 const m=t.match(/const BUILD='([0-9]+)'/);
 if(m&&m[1]!==BUILD&&!sessionStorage.getItem('rl'+m[1])){sessionStorage.setItem('rl'+m[1],1);location.replace(location.pathname+'?v='+m[1])}
}catch(e){}})();
const go=v=>{V=v;R();scrollTo(0,0)};
const PW='9903b7af8f28355dd09a3a1af1558401d357105dc05d9a8ec26a544e8669a8af';
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ep-v1:'+t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const ok=()=>localStorage.getItem('ep_ok')===PW;

function parse(t){
  return t.split(/^\s*Q\d+\.\s*/m).slice(1).map(b=>{
    const qs=[],o=[];
    b.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
      const m=l.match(/^(\d+)\.\s*(.*)$/);
      if(m)o.push(m[2]);else if(!o.length)qs.push(l);
    });
    return{q:qs.join(' '),o,a:null};
  }).filter(x=>x.q&&x.o.length>1);
}
async function translate(qs){
  const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.cfg.key},
    body:JSON.stringify({model:S.cfg.model,messages:[{role:'user',content:
    'Translate these Korean university engineering quiz questions and answer options into English. Reply ONLY with a JSON array, same length and order, each item {"q":"...","o":["..."]} with the same number of options. Keep O and X unchanged.\n'+JSON.stringify(qs.map(x=>({q:x.q,o:x.o})))}]})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);
  const t=j.choices[0].message.content,a=JSON.parse(t.slice(t.indexOf('['),t.lastIndexOf(']')+1));
  if(a.length!==qs.length)throw new Error('Translation count mismatch');
  qs.forEach((x,i)=>{x.qe=a[i].q;x.oe=a[i].o});
}
const busy=m=>{app.innerHTML=`<h1>${m}</h1><p class="m">Please keep this page open.</p>`};

function R(){
  const AS=getSubs(),subs=Object.keys(AS);let h='';
  if((V=='upload'||V=='answers')&&!ok()){
    h=`<h1>Upload is locked</h1><p class="m">Only people with the password can add quizzes.</p><label>Password</label><input id="pw" type="password" autocomplete="off"><button class="pri full" data-a="unlock">Unlock</button>`;
  }else if(V=='upload'){
    h=`<h1>Add a quiz</h1>
    <label>Subject</label>
    <select id="sub">${subs.map(s=>`<option>${esc(s)}</option>`).join('')}<option value="">+ New subject</option></select>
    <input id="ns" placeholder="New subject name" style="margin-top:.6rem;${subs.length?'display:none':''}">
    <label>Quiz text file (.txt)</label><input id="file" type="file" accept=".txt,text/plain">
    <label>Exam name (optional)</label><input id="ti" placeholder="e.g. Lecture 3">
    <button class="pri full" data-a="up">Next: set correct answers</button><button class="full" data-a="lock">Lock upload</button>`;
  }else if(V=='answers'){
    const q=D.qs[D.i],n=D.qs.length;
    h=`<h1>Set correct answers</h1><p class="m">${esc(D.title)} · question ${D.i+1} of ${n}</p>
    <div class="card"><b>${esc(q.q)}</b></div><p class="m">Tap the correct answer:</p>`+
    q.o.map((o,k)=>`<button class="opt ${q.a===k?'sel':''}" data-a="setans" data-v="${k}">${k+1}. ${esc(o)}</button>`).join('')+
    `<div class="row"><button data-a="prev" ${D.i?'':'disabled'}>Back</button>${D.i<n-1?'<button data-a="next">Next</button>':'<button class="pri" data-a="finish">Save exam</button>'}</div>`;
  }else if(V=='exsub'){
    h=inst()+`<h1>Choose a subject</h1>`+(subs.length?subs.map(s=>`<button class="opt" data-a="subj" data-v="${esc(s)}">${esc(s)} (${AS[s].length})</button>`).join(''):`<p>No exams yet. Add a quiz first.</p>`);
  }else if(V=='exlist'){
    const L=AS[Sub]||[];
    h=`<h1>${esc(Sub)}</h1>`+(L.length?L.map(e=>{
      const set=e.qs.filter(x=>x.a!=null).length,en=e.qs[0]&&e.qs[0].qe;
      return `<div class="card"><b>${esc(e.title)}</b><p class="m">${e.b?'Built-in · ':''}${e.qs.length} questions · answers set ${set}/${e.qs.length} · ${en?'KR + EN':'Korean only'}</p>
      <button class="pri full" data-a="start" data-w="${e.id}">Start exam</button>
      ${e.b?'':`<div class="row"><button data-a="edit" data-w="${e.id}">Edit answers</button>${en?'':`<button data-a="tr" data-w="${e.id}">Translate</button>`}<button data-a="del" data-w="${e.id}">Delete</button></div>`}</div>`}).join(''):'<p>No exams in this subject.</p>')+
      `<button class="full" data-a="go" data-v="exsub">Back to subjects</button>`;
  }else if(V=='quiz'){
    const n=Q.ex.qs.length,x=Q.ex.qs[Q.i],d=Q.sel[Q.i]!=null;
    h=tgl()+`<p class="m">${esc(Q.ex.title)} · ${Q.i+1} / ${n}</p>
    <div class="card"><b>${esc(x.q)}</b>${tr(x,d)}</div>`+
    x.o.map((o,k)=>{let c='opt';
      if(d&&x.a!=null){if(k===x.a)c+=' ok';else if(k===Q.sel[Q.i])c+=' bad'}else if(d&&k===Q.sel[Q.i])c+=' sel';
      return `<button class="${c}" data-a="pick" data-v="${k}">${k+1}. ${esc(o)}${x.oe&&enOn()&&(!Q.ex.lt||d)?`<div class="en">${esc(x.oe[k])}</div>`:''}</button>`}).join('')+
    (d?`<p><b>${x.a==null?'No answer key set for this question':Q.sel[Q.i]===x.a?'✔ Correct':'✘ Wrong'}</b></p><button class="pri full" data-a="nq">${Q.i<n-1?'Next question':'See result'}</button>`:'');
  }else if(V=='result'){
    const qs=Q.ex.qs,keyed=qs.filter(x=>x.a!=null),right=qs.filter((x,i)=>x.a!=null&&Q.sel[i]===x.a).length;
    const wr=qs.map((x,i)=>[x,i]).filter(([x,i])=>x.a!=null&&Q.sel[i]!==x.a);
    h=tgl()+`<h1>Result</h1><div class="card"><div class="big">${right} / ${keyed.length}</div></div>`+
    (wr.length?`<h1>Review wrong answers</h1>`+wr.map(([x,i])=>`<div class="card"><b>${esc(x.q)}</b>${tr(x,1)}
      <p>Your answer: ${Q.sel[i]!=null?esc(x.o[Q.sel[i]]):'-'}</p><p><b>Correct: ${esc(x.o[x.a])}</b>${x.oe?`<span class="en"> (${esc(x.oe[x.a])})</span>`:''}</p></div>`).join(''):'<p><b>All correct!</b></p>')+
    `<div class="row"><button class="pri" data-a="start" data-w="${Q.ex.id}">Try again</button><button data-a="go" data-v="exlist">Back</button></div>`;
  }else if(V=='settings'){
    h=`<h1>Settings</h1><label>Show translations</label>${tgl()}${inst(1)}
    ${ok()?`<label>OpenRouter API key (stored only on this phone)</label><input id="key" type="password" value="${esc(S.cfg.key)}" placeholder="sk-or-...">
    <label>Model</label><input id="model" value="${esc(S.cfg.model)}">
    <button class="pri full" data-a="cfg">Save settings</button>`:''}
    <label>Text size: ${S.cfg.fs}px</label>
    <div class="row"><button data-a="fs" data-v="-1">A −</button><button data-a="fs" data-v="1">A +</button></div>
    <label>Backup</label>
    <div class="row"><button data-a="exp">Download backup</button><button data-a="imp">Restore backup</button></div>
    <input id="bk" type="file" accept=".json" style="display:none">`;
  }
  app.innerHTML=h;
  const t={upload:'upload',answers:'upload',settings:'settings'}[V]||'exsub';
  $('#nv').innerHTML=`<nav>${[['upload','Add quiz'],['exsub','Exam'],['settings','Settings']].map(([k,l])=>`<button data-a="go" data-v="${k}" class="${t==k?'on':''}">${l}</button>`).join('')}</nav>`;
}

const BUILTIN={"Basic Mechanics 기초역학":[{"id":"b1","title":"01 Engineering intro","qs":[{"q":"기계공학의 기본 4대 역학에 해당 되지 않는 것은?","o":["고체역학","유체역학","정역학","열역학"],"qe":"Which of the following is NOT one of the four basic mechanics of mechanical engineering?","a":2,"oe":["Mechanics of solids","Fluid mechanics","Statics","Thermodynamics"],"si":"යාන්ත්‍රික ඉංජිනේරු විද්‍යාවේ මූලික යාන්ත්‍ර විද්‍යා හතරට අයත් නොවන්නේ කුමක්ද? 1. ඝන යාන්ත්‍ර විද්‍යාව 2. ද්‍රව යාන්ත්‍ර විද්‍යාව 3. ස්ථිති විද්‍යාව (Statics) 4. තාප ගතිකය"},{"q":"기계공학에서 제조분야에 대한 분류중에, 제조장비의 유지 보수, 생산을 위한 자동화 장비 개발등에 해당되는 것은?","o":["생산기술분야","구매분야"],"qe":"Within the manufacturing field classification of mechanical engineering, which covers maintenance of manufacturing equipment and development of automated equipment for production?","a":0,"oe":["Production engineering","Purchasing"],"si":"යාන්ත්‍රික ඉංජිනේරු විද්‍යාවේ නිෂ්පාදන ක්ෂේත්‍ර වර්ගීකරණයේදී, නිෂ්පාදන උපකරණ නඩත්තුව සහ නිෂ්පාදනය සඳහා ස්වයංක්‍රීය උපකරණ සංවර්ධනය අයත් වන්නේ කුමකටද? 1. නිෂ්පාදන ඉංජිනේරු ක්ෂේත්‍රය 2. ප්‍රසම්පාදන ක්ෂේත්‍රය"},{"q":"기계분야에서는 자동차공학, 로봇, 드론 등을 AI와 접목하여 4차 산업혁명에 따라 육성되고 있는 분야는?","o":["모빌리티","전기자동차","스마트펙토리","디지털트윈"],"qe":"In mechanical engineering, which field combines automobile engineering, robots, drones, etc. with AI and is being fostered under the 4th Industrial Revolution?","a":0,"oe":["Mobility","Electric vehicles","Smart factory","Digital twin"],"si":"මෝටර් රථ ඉංජිනේරු විද්‍යාව, රොබෝ, ඩ්‍රෝන ආදිය AI සමඟ ඒකාබද්ධ කර, සිව්වන කාර්මික විප්ලවය යටතේ ප්‍රවර්ධනය කරන ක්ෂේත්‍රය කුමක්ද? 1. Mobility 2. විදුලි වාහන 3. Smart factory 4. Digital twin"},{"q":"공학이란  나은 기술을 개발 하기 위해 수학, 과학, 재료등을 유용하게 활용하여 산업발전에 이바지 하는 것이다.","o":["O","X"],"qe":"Engineering is the useful application of mathematics, science, materials, etc. to develop better technology and contribute to industrial development.","a":0,"si":"ඉංජිනේරු විද්‍යාව යනු වඩා හොඳ තාක්ෂණයක් සංවර්ධනය කිරීම සඳහා ගණිතය, විද්‍යාව, ද්‍රව්‍ය ආදිය ප්‍රයෝජනවත් ලෙස යොදා ගනිමින් කාර්මික දියුණුවට දායක වීමයි."}],"b":1},{"id":"b2","title":"02 The mechanical engineer, ISO and ASME","qs":[{"q":"4차산업혁명을 통하여 기계공학자들은 여러 분야의 융합된 엔지니어로써 활동해야 한다.","o":["O","X"],"qe":"Through the 4th Industrial Revolution, mechanical engineers must work as engineers with converged knowledge from many fields.","a":0,"si":"සිව්වන කාර්මික විප්ලවය හරහා යාන්ත්‍රික ඉංජිනේරුවන් විවිධ ක්ෂේත්‍ර ඒකාබද්ධ වූ ඉංජිනේරුවන් ලෙස කටයුතු කළ යුතුය."},{"q":"국제표준화기구는 ISO이다.","o":["O","X"],"qe":"The International Organization for Standardization is ISO.","a":0,"si":"ජාත්‍යන්තර ප්‍රමිතිකරණ සංවිධානය (International Organization for Standardization) ISO වේ."},{"q":"미국기계공학회는 ASME라고 한다.","o":["O","X"],"qe":"The American Society of Mechanical Engineers is called ASME.","a":0,"si":"ඇමරිකානු යාන්ත්‍රික ඉංජිනේරුවන්ගේ සංගමය (American Society of Mechanical Engineers) ASME ලෙස හැඳින්වේ."},{"q":"기계공학자의 핵심은 혁신과 설계라고 볼 수 있다.","o":["O","X"],"qe":"The core of a mechanical engineer can be seen as innovation and design.","a":0,"si":"යාන්ත්‍රික ඉංජිනේරුවෙකුගේ හරය නවෝත්පාදනය (innovation) සහ සැලසුම්කරණය (design) ලෙස සැලකිය හැක."}],"b":1},{"id":"b3","title":"03 Design process","qs":[{"q":"고고학자들의 설계 프로세스는 준비, 발굴, 평가, 설명의 순으로 수행한다.","o":["O","X"],"qe":"Archaeologists' design process is carried out in the order: preparation, excavation, evaluation, explanation.","a":0,"si":"පුරාවිද්‍යාඥයන්ගේ සැලසුම් ක්‍රියාවලිය සකස් කිරීම, කැණීම, ඇගයීම, පැහැදිලි කිරීම යන පිළිවෙලට සිදු කෙරේ."},{"q":"기계설계중에 상세설계단계에서는 제품 배치도, 재료 선택, 시스템 시뮬레이션등을 수행한다.","o":["O","X"],"qe":"In mechanical design, the detailed design stage involves product layout, material selection, system simulation, etc.","a":1,"si":"යාන්ත්‍රික සැලසුම්කරණයේ විස්තරාත්මක සැලසුම් (detailed design) අදියරේදී නිෂ්පාදන පිරිසැලසුම, ද්‍රව්‍ය තේරීම, පද්ධති simulation ආදිය සිදු කෙරේ."},{"q":"아이디어들을 선별하고 소수의 최적 설계 개념을 도출하고, CAD 모델링 및 시제품등에 분석은 수렴적 사고에 해당된다.","o":["O","X"],"qe":"Screening ideas, deriving a few optimal design concepts, and analysis through CAD modeling and prototypes are convergent thinking.","a":0,"si":"අදහස් පෙරීම, ප්‍රශස්ත සැලසුම් සංකල්ප කිහිපයක් ලබා ගැනීම, CAD modeling සහ ආදර්ශක (prototype) විශ්ලේෂණය යනු අභිසාරී චින්තනයට (convergent thinking) අයත් වේ."},{"q":"기계공학자의 문서화 작업중에, 기술에 대한 권한을 가지는 행위는 의장특허, 실용특허 등을 활용한다.","o":["O","X"],"qe":"Among a mechanical engineer's documentation work, obtaining rights to a technology uses design patents, utility patents, etc.","a":0,"si":"යාන්ත්‍රික ඉංජිනේරුවෙකුගේ ලේඛනගත කිරීමේ කටයුතුවලදී, තාක්ෂණයක් පිළිබඳ අයිතිය ලබා ගැනීමට design patent, utility patent ආදිය භාවිත කෙරේ."}],"b":1},{"id":"b4","title":"04 Manufacturing processes","qs":[{"q":"주철, 알루미늄 혹은 청동과 같은 액체상태 금속을 틀에 부어 냉각 후 굳히는 공정을 주조하라고 한다.","o":["O","X"],"qe":"Pouring liquid metal such as cast iron, aluminum, or bronze into a mold and letting it cool and solidify is called casting.","a":0,"si":"වාත්තු යකඩ, ඇලුමිනියම් හෝ ලෝකඩ වැනි දියවූ ලෝහ අච්චුවකට වත්කර සිසිල් කර ඝන කිරීමේ ක්‍රියාවලිය වාත්තු කිරීම (casting) ලෙස හැඳින්වේ."},{"q":"금속 판재를 롤러 사이에서 압축하여 정해진 두께로 제조를 압연이라고 한다.","o":["O","X"],"qe":"Compressing sheet metal between rollers to make a specified thickness is called rolling.","a":0,"si":"ලෝහ තහඩුවක් රෝලර් අතර සම්පීඩනය කර නියමිත ඝනකමකට සකසන ක්‍රියාවලිය රෝලිං (rolling) ලෙස හැඳින්වේ."},{"q":"부품 및 제품을 만들기 위하여, 열가소성수지, 광중합체등을 활용하여 CAD와 연동하여 제작하는 방법을 쾌속조형법이라고 한다.","o":["O","X"],"qe":"Making parts and products linked with CAD using thermoplastics, photopolymers, etc. is called rapid prototyping.","a":0,"si":"තාප ප්ලාස්ටික්, photopolymer ආදිය භාවිතයෙන් CAD සමඟ සම්බන්ධ කර කොටස් සහ නිෂ්පාදන සෑදීමේ ක්‍රමය ශීඝ්‍ර ආදර්ශක නිර්මාණය (rapid prototyping) ලෙස හැඳින්වේ."},{"q":"MCT는 자동으로 공구를 바꾸어 가며 형상을 만들어내는 가공기계을 말한다.","o":["O","X"],"qe":"MCT refers to a machine tool that automatically changes tools to create shapes.","a":0,"si":"MCT යනු ස්වයංක්‍රීයව මෙවලම් මාරු කරමින් හැඩතල නිර්මාණය කරන යන්ත්‍රයයි."}],"b":1},{"id":"b5","title":"05 Problem solving","qs":[{"q":"문제해결 풀이 단계는 접근방법, 풀이, 검토의 3단계가 기본이다.","o":["O","X"],"qe":"The problem-solving process has three basic steps: approach, solution, and review.","a":0,"si":"ගැටලු විසඳීමේ මූලික පියවර තුන: ප්‍රවේශය (approach), විසඳුම (solution), සමාලෝචනය (review)."},{"q":"화성 기후 탐사위성 실종 사건은 단위환산의 의사 소통 문제로 발생한 유명한 사건이다.","o":["O","X"],"qe":"The loss of the Mars climate orbiter is a famous incident caused by a unit-conversion communication problem.","a":0,"si":"අඟහරු දේශගුණ චන්ද්‍රිකාව අතුරුදහන් වීම, ඒකක පරිවර්තනය පිළිබඳ සන්නිවේදන ගැටලුවක් නිසා ඇති වූ ප්‍රසිද්ධ සිදුවීමකි."},{"q":"캐나다 항공 143편 비행기 비상착륙사건은 무게 단위환산 문제로 인한 비행기 연료 부족으로 불시착사건으로 유명하다.","o":["O","X"],"qe":"The Air Canada Flight 143 emergency landing is famous as a forced landing caused by fuel shortage due to a weight unit-conversion error.","a":0,"si":"Air Canada 143 ගුවන් ගමනේ හදිසි ගොඩබෑම, බර ඒකක පරිවර්තන දෝෂයක් නිසා ඉන්ධන හිඟයෙන් සිදු වූ බලහත්කාර ගොඩබෑමක් ලෙස ප්‍රසිද්ධය."},{"q":"문제해결 단계중에 단계적 계산과 함께 설명과 그림을 포함하여 수행하는 것은 풀이 단계이다.","o":["O","X"],"qe":"In problem solving, the step that includes step-by-step calculations along with explanations and figures is the solution step.","a":0,"si":"ගැටලු විසඳීමේදී, පියවරෙන් පියවර ගණනය කිරීම් සමඟ පැහැදිලි කිරීම් සහ රූප ඇතුළත් කරන පියවර විසඳුම (solution) පියවරයි."}],"b":1},{"id":"b6","title":"06 Units (SI and USCS)","qs":[{"q":"단위계에는 국제단위계(SI)와 미국전통단위계(USCS)가 있다.","o":["O","X"],"qe":"The systems of units are the International System (SI) and the US Customary System (USCS).","a":0,"si":"ඒකක පද්ධති වන්නේ ජාත්‍යන්තර ඒකක පද්ධතිය (SI) සහ ඇමරිකානු සම්ප්‍රදායික ඒකක පද්ධතිය (USCS) ය."},{"q":"국제단위계에서 길이(m), 질량(kg), 시간(s) 등으로 표기되면 기본단위계이다.","o":["O","X"],"qe":"In SI, quantities written as length (m), mass (kg), time (s), etc. are base units.","a":0,"si":"SI හි දිග (m), ස්කන්ධය (kg), කාලය (s) ආදියෙන් දක්වන ඒවා මූලික ඒකක වේ."},{"q":"크기 접두사중에 “기가”는 “G”로 표기되며, 10의 9승 의 값을 가진다.","o":["O","X"],"qe":"Among size prefixes, 'giga' is written 'G' and has a value of 10 to the 9th power.","a":0,"si":"ප්‍රමාණ උපසර්ග අතර 'ගිගා' 'G' ලෙස ලියන අතර එහි අගය 10 ට 9 බලයයි (10⁹)."},{"q":"무게는 질량에서 중력가속도를 곱한 것으로 계산된다.","o":["O","X"],"qe":"Weight is calculated as mass multiplied by gravitational acceleration.","a":0,"si":"බර (weight) ගණනය කරන්නේ ස්කන්ධය ගුරුත්වජ ත්වරණයෙන් ගුණ කිරීමෙනි."}],"b":1},{"id":"b7","title":"07 Units and conversion","qs":[{"q":"힘은 N으로 표시되며, 질량과 가속도의 곱으로 나타난다.","o":["O","X"],"qe":"Force is expressed in N and is the product of mass and acceleration.","a":0,"si":"බලය N වලින් දක්වන අතර එය ස්කන්ධය සහ ත්වරණයේ ගුණිතයයි."},{"q":"1 마력은 0.7457kW으로 표시가 가능하다.","o":["O","X"],"qe":"1 horsepower can be expressed as 0.7457 kW.","a":0,"si":"අශ්ව බලය 1 ක් 0.7457 kW ලෙස දැක්විය හැක."},{"q":"미국전통단위계에서 gal.은 부피를 나타낸다.","o":["O","X"],"qe":"In the US Customary System, gal. represents volume.","a":0,"si":"ඇමරිකානු සම්ප්‍රදායික ඒකක පද්ධතියේ gal. දක්වන්නේ පරිමාවයි."},{"q":"미국전통단위계에서 mi는 거리를 나타낸다.","o":["O","X"],"qe":"In the US Customary System, mi represents distance.","a":0,"si":"ඇමරිකානු සම්ප්‍රදායික ඒකක පද්ධතියේ mi දක්වන්නේ දුරයි."}],"b":1},{"id":"b8","title":"08 Estimation and significant digits","qs":[{"q":"불완전하고 부정확한 주먹구구식 계산이지만 없는 것보다 낫다. 이 계산은 비공식적으로 신속히 수행할 수 있으므로 간이 계산 이라고도 한다.","o":["O","X"],"qe":"A rough, imprecise back-of-the-envelope calculation is better than none. It can be done quickly and informally, so it is also called a quick estimate.","a":0,"si":"අසම්පූර්ණ සහ නිරවද්‍ය නොවන ආසන්න ගණනය කිරීමක් වුවද, කිසිවක් නොමැතිවීමට වඩා හොඳය. එය අනියමින් ඉක්මනින් කළ හැකි නිසා 'ඉක්මන් ඇස්තමේන්තුව' ලෙසද හැඳින්වේ."},{"q":"차원 일치(dimensional consistency)란 방정식 등호 양쪽의 수치값과 관련 단위가 일치해야 함을 의미한다.","o":["O","X"],"qe":"Dimensional consistency means the numerical values and associated units on both sides of an equation's equals sign must match.","a":0,"si":"මාන අනුකූලතාව (dimensional consistency) යනු සමීකරණයක සමාන ලකුණේ දෙපස සංඛ්‍යාත්මක අගයන් සහ ඒවාට අදාළ ඒකක ගැළපිය යුතු බවයි."},{"q":"어떤 숫자의 정확도(precision)는 그 숫자를 나타내는 데 사용된 마지막 유효숫자 크기의 절반이다.","o":["O","X"],"qe":"The precision of a number is half the magnitude of the last significant digit used to represent it.","a":0,"si":"සංඛ්‍යාවක නිරවද්‍යතාව (precision) යනු එය දැක්වීමට භාවිත කළ අවසාන සැලකිය යුතු ඉලක්කමේ විශාලත්වයෙන් අඩකි."},{"q":"유효숫자(significant digits)는 주어진 정보, 근사과정, 계산 자체에 존재하는 오 차범위의 관점에서 정확하고 신뢰할 만하다고 알려진 숫자이다.","o":["O","X"],"qe":"Significant digits are digits known to be accurate and reliable in view of the error range in the given information, the approximation process, and the calculation itself.","a":0,"si":"සැලකිය යුතු ඉලක්කම් (significant digits) යනු ලබා දී ඇති තොරතුරු, ආසන්න කිරීමේ ක්‍රියාවලිය සහ ගණනය කිරීම තුළ ඇති දෝෂ පරාසය අනුව නිවැරදි සහ විශ්වාසදායක යැයි දන්නා ඉලක්කම් ය."}],"b":1},{"id":"b9","title":"09 Technical reports and presentations","qs":[{"q":"공학보고서에는 표지, 요약문, 보고서 본문, 목차, 결론, 부록등으로 구성이 되어야 한다.","o":["O","X"],"qe":"An engineering report should consist of a cover, abstract, main body, table of contents, conclusion, appendix, etc.","a":0,"si":"ඉංජිනේරු වාර්තාවක් පිටකවරය, සාරාංශය, ප්‍රධාන කොටස, පටුන, නිගමනය, ඇමුණුම් ආදියෙන් සමන්විත විය යුතුය."},{"q":"기술보고서에는 그림, 그래프, 차트, 표등이 포함하여야 한다.","o":["O","X"],"qe":"A technical report should include figures, graphs, charts, tables, etc.","a":0,"si":"තාක්ෂණික වාර්තාවකට රූප, ප්‍රස්තාර, charts, වගු ආදිය ඇතුළත් විය යුතුය."},{"q":"기술보고서는 서술형 문장으로 작성하여, 교재나 일반 책자의 형식을 작성한다.","o":["O","X"],"qe":"A technical report should be written in narrative sentences, in the format of a textbook or general book.","a":1,"si":"තාක්ෂණික වාර්තාව විස්තරාත්මක වාක්‍යවලින්, පෙළ පොතක් හෝ සාමාන්‍ය පොතක ආකෘතියට ලිවිය යුතුය."},{"q":"기술적인 발표의 종류는 조직상의 회의, 세미나, 학술대회, 고객의 프리젠테이션 등을 포함한다.","o":["O","X"],"qe":"Types of technical presentations include organizational meetings, seminars, academic conferences, and customer presentations.","a":0,"si":"තාක්ෂණික ඉදිරිපත් කිරීම් වර්ග අතර සංවිධානාත්මක රැස්වීම්, සම්මන්ත්‍රණ, ශාස්ත්‍රීය සමුළු, පාරිභෝගික ඉදිරිපත් කිරීම් ඇතුළත් වේ."}],"b":1},{"id":"b10","title":"10 Data and trendlines","qs":[{"q":"상용프로그램을 활용하여, 추세선의 수식을 구하면 측정하지 않은 부분 혹은 구간에서도 예측이 가능하다.","o":["O","X"],"qe":"Using commercial software to obtain the trendline equation makes it possible to predict even in unmeasured parts or ranges.","a":0,"si":"වාණිජ මෘදුකාංග භාවිතයෙන් trendline සමීකරණය ලබා ගැනීමෙන්, මැනීම් නොකළ කොටස්වල හෝ පරාසවලද අනාවැකි කිව හැක."},{"q":"데이터를 입력후, 데이터 값을 항목별로 자릿수를 정리하여 일치시킨다.","o":["O","X"],"qe":"After entering data, align the number of decimal places of each item's values.","a":0,"si":"දත්ත ඇතුළත් කිරීමෙන් පසු, එක් එක් අයිතමයේ අගයන්හි දශම ස්ථාන ගණන සමාන කරන්න."},{"q":"스프링의 하중을 계산하기 위해서는  F=kx의 기본식을 활용한다.","o":["O","X"],"qe":"To calculate a spring's load, the basic equation F=kx is used.","a":0,"si":"spring එකක බර (load) ගණනය කිරීමට F=kx මූලික සමීකරණය භාවිත කෙරේ."},{"q":"실험 데이터에서, 질량을 먼저 구하고, 변위를 구했다면 질량을 이용하여 하중을 계산해야, F=kx에 대한 그래프를 구해 낼 수 있다.","o":["O","X"],"qe":"In experimental data, if mass was found first and then displacement, the load must be calculated from mass to obtain the F=kx graph.","a":0,"si":"පර්යේෂණ දත්තවල ස්කන්ධය මුලින් සොයා පසුව විස්ථාපනය සොයා ඇත්නම්, F=kx ප්‍රස්තාරය ලබා ගැනීමට ස්කන්ධය භාවිතයෙන් බර (load) ගණනය කළ යුතුය."}],"b":1},{"id":"b11","title":"11 Vectors and scalars","qs":[{"q":"삼각함수의 사인법칙은  A /sin a  =  B / sin b   =  C / sin c 이다.","o":["O","X"],"qe":"The law of sines is A / sin a = B / sin b = C / sin c.","a":0,"si":"සයින් නීතිය A / sin a = B / sin b = C / sin c වේ."},{"q":"스칼라는 크기만을 나타내며, 질량, 길이등이 있다.","o":["O","X"],"qe":"A scalar expresses magnitude only, such as mass and length.","a":0,"si":"අදිශය (scalar) ප්‍රමාණය පමණක් දක්වයි; උදා: ස්කන්ධය, දිග."},{"q":"벡터의 구성요소는 크기, 방향, 작용점을 가지고 있다.","o":["O","X"],"qe":"The components of a vector are magnitude, direction, and point of application.","a":0,"si":"දෛශිකයක (vector) සංරචක වන්නේ විශාලත්වය, දිශාව සහ ක්‍රියා ලක්ෂ්‍යයයි."},{"q":"벡터 A 와 벡터 –A는 크기는 같고, 방향이 반대이다.","o":["O","X"],"qe":"Vector A and vector –A have the same magnitude and opposite directions.","a":0,"si":"A දෛශිකය සහ –A දෛශිකය විශාලත්වයෙන් සමාන වන අතර දිශාව ප්‍රතිවිරුද්ධය."}],"b":1},{"id":"b12","title":"12 Vector composition","qs":[{"q":"2개이상의 벡터의 합성 벡터를 구하기 위하여, 평행사변형법 혹은 다각형법을 사용하면 된다.","o":["O","X"],"qe":"To find the resultant of two or more vectors, the parallelogram method or polygon method can be used.","a":0,"si":"දෛශික දෙකක් හෝ වැඩි ගණනක සම්ප්‍රයුක්ත (resultant) දෛශිකය සෙවීමට සමාන්තරාස්‍ර ක්‍රමය හෝ බහුඅස්‍ර ක්‍රමය භාවිත කළ හැක."},{"q":"3개이상의 벡터의 합성 벡터를 구하기 위해서는 CAD등과 같이 도식적으로 확인하면 편리하다.","o":["O","X"],"qe":"To find the resultant of three or more vectors, it is convenient to check graphically, such as in CAD.","a":0,"si":"දෛශික තුනක් හෝ වැඩි ගණනක සම්ප්‍රයුක්තය සෙවීමට CAD වැනි දෙයක් භාවිතයෙන් චිත්‍රක ලෙස පරීක්ෂා කිරීම පහසුය."},{"q":"모든 벡터 성분은 x, y, z축에 맞게 성분 분해가 가능하며, 계산도 편리하다.","o":["O","X"],"qe":"Every vector can be resolved into components along the x, y, z axes, and calculation is convenient.","a":0,"si":"සියලු දෛශික x, y, z අක්ෂවලට අනුව සංරචකවලට වෙන් කළ හැකි අතර ගණනය කිරීමද පහසුය."},{"q":"3개이상의 벡터의 합성은 각 벡터의 성분을 분해하여, 각각의 성분 즉, x 성분, y 성분을 합하여, 합성 성분을 계산 할 수 있다.","o":["O","X"],"qe":"The resultant of three or more vectors can be calculated by resolving each vector into components and summing the x components and y components.","a":0,"si":"දෛශික තුනක් හෝ වැඩි ගණනක සම්ප්‍රයුක්තය, එක් එක් දෛශිකය සංරචකවලට වෙන් කර, x සංරචක සහ y සංරචක වෙන වෙනම එකතු කිරීමෙන් ගණනය කළ හැක."}],"b":1}],"Mechatronics 메카트로닉스 현장전문용어":[{"id":"m3","title":"Lesson 3","qs":[{"q":"재료의 경도 측정법이 아닌 것은?","o":["샤르피시험법","반발에 의한 방법","긋기에 의한 방법","압입경도시험"],"a":0,"qe":"Which of the following is NOT a method of measuring material hardness?","oe":["Charpy test","Rebound method","Scratch method","Indentation hardness test"],"si":"ද්‍රව්‍යයක දෘඪතාව මැනීමේ ක්‍රමයක් නොවන්නේ කුමක්ද? 1. Charpy පරීක්ෂණය 2. ප්‍රතිවර්තන (rebound) ක්‍රමය 3. ඉරීමේ (scratch) ක්‍රමය 4. ඇතුල් කිරීමේ දෘඪතා පරීක්ෂණය (indentation)"},{"q":"금속에 외력을 가하였다가 외력을 제거하면 원래 상태로 되돌아가는 성질은 탄성이다.(O/X)","o":["O","X"],"a":0,"qe":"The property of metal returning to its original state when an external force applied to it is removed is elasticity.","si":"ලෝහයකට බාහිර බලයක් යොදා, එය ඉවත් කළ විට මුල් තත්ත්වයට පැමිණීමේ ගුණය ප්‍රත්‍යාස්ථතාව (elasticity) වේ."}],"b":1},{"id":"m4","title":"Lesson 4","qs":[{"q":"재료의 경도 측정법이 아닌 것은?","o":["샤르피시험법","반발에 의한 방법","긋기에 의한 방법","압입경도시험"],"a":0,"qe":"Which of the following is NOT a method of measuring material hardness?","oe":["Charpy test","Rebound method","Scratch method","Indentation hardness test"],"si":"ද්‍රව්‍යයක දෘඪතාව මැනීමේ ක්‍රමයක් නොවන්නේ කුමක්ද? 1. Charpy පරීක්ෂණය 2. ප්‍රතිවර්තන (rebound) ක්‍රමය 3. ඉරීමේ (scratch) ක්‍රමය 4. ඇතුල් කිරීමේ දෘඪතා පරීක්ෂණය (indentation)"},{"q":"금속에 외력을 가하였다가 외력을 제거하면 원래 상태로 되돌아가는 성질은 탄성이다.(O/X)","o":["O","X"],"a":0,"qe":"The property of metal returning to its original state when an external force applied to it is removed is elasticity.","si":"ලෝහයකට බාහිර බලයක් යොදා, එය ඉවත් කළ විට මුල් තත්ත්වයට පැමිණීමේ ගුණය ප්‍රත්‍යාස්ථතාව (elasticity) වේ."}],"b":1},{"id":"m5","title":"Lesson 5","qs":[{"q":"강의 일반열처리법중 인성증가,조직의 안정화,스트레스제거의 목적으로 하는 열처리 방법은 뜨임이다.(O/X)","o":["O","X"],"a":0,"qe":"Among general heat treatments of steel, the one aimed at increasing toughness, stabilizing the structure, and relieving stress is tempering.","si":"වානේවල සාමාන්‍ය තාප පිරියම් කිරීම් අතර, තද බව (toughness) වැඩි කිරීම, ව්‍යුහය ස්ථායී කිරීම සහ stress ඉවත් කිරීම අරමුණු කරගත් ක්‍රමය tempering වේ."},{"q":"강의 일반 열처리 종류에 포함되지 않는 것은?","o":["담금질","풀림","불림","질화법"],"a":3,"qe":"Which is NOT included in the general heat treatments of steel?","oe":["Quenching","Annealing","Normalizing","Nitriding"],"si":"වානේවල සාමාන්‍ය තාප පිරියම් කිරීම් අතර ඇතුළත් නොවන්නේ කුමක්ද? 1. Quenching 2. Annealing 3. Normalizing 4. Nitriding"}],"b":1},{"id":"m6","title":"Lesson 6","qs":[{"q":"강의 표준조직이 아닌 것은?","o":["마르텐사이트","공석강","공정","고용체"],"a":0,"qe":"Which of the following is NOT a standard structure of steel?","oe":["Martensite","Eutectoid steel","Eutectic","Solid solution"],"si":"වානේවල සම්මත ව්‍යුහයක් (standard structure) නොවන්නේ කුමක්ද? 1. Martensite 2. Eutectoid steel 3. Eutectic 4. Solid solution"},{"q":"순수 금속이나 합금을 용융점에서부터 아주 서서히 냉각시키면서 상태의 변화를 나타낸 그래프로 가로축은 첨가한 원소의 비율을 세로축은 온도를 나타낸 그래프는 평행상태도이다.(O/X)","o": වන අතර shortcut එක 'E' වේ."}]},{"id":"c2","title":"02 Projection and coordinates","b":1,"qs":[{"q":"평행 투상(parallel projection)은 시선이 평행인 투상를 말하며, 주로 기계도면에서 사용된다.","o":["O","X"],"a":0,"qe":"Parallel projection means projection with parallel lines of sight, mainly used in mechanical drawings.","si":"සමාන්තර ප්‍රක්ෂේපණය (parallel projection) යනු දෘෂ්ටි රේඛා සමාන්තර වන ප්‍රක්ෂේපණයයි; එය බොහෝවිට යාන්ත්‍රික ඇඳීම්වල භාවිත වේ."},{"q":"주투상도(정면도)의 선택은 평행 투상(parallel projection)은 대상물의 모양 및 기능이 가장 명확히 표시되는 면을 선택한다.","o":["O","X"],"a":0,"qe":"For the main view (front view), choose the face that shows the object's shape and function most clearly.","si":"ප්‍රධාන දසුන (front view) තෝරා ගැනීමේදී වස්තුවේ හැඩය සහ ක්‍රියාකාරිත්වය වඩාත් පැහැදිලිව පෙන්වන මුහුණත තෝරන්න."},{"q":"3각법은 물체를 “눈 → 투상 → 물체”의 순서로 투상한다.","o":["O","X"],"a":0,"qe":"In third-angle projection, the object is projected in the order 'eye → projection → object'.","si":"තුන්වන කෝණ ප්‍රක්ෂේපණයේදී (third-angle projection) වස්තුව 'ඇස → ප්‍රක්ෂේපණය → වස්තුව' පිළිවෙලට ප්‍රක්ෂේපණය කෙරේ."},{"q":"AutoCAD에서 선을 그리는 방법은 절대좌표, 상대좌표, 상대극좌표를 이용하여 그리는 방법이 있다.","o":["O","X"],"a":0,"qe":"In AutoCAD, lines can be drawn using absolute coordinates, relative coordinates, and relative polar coordinates.","si":"AutoCAD හි රේඛා ඇඳීමට absolute coordinates, relative coordinates සහ relative polar coordinates භාවිත කළ හැක."}]},{"id":"c3","title":"03 Limits, grid, snap, ortho","b":1,"qs":[{"q":"AutoCAD에서 용지의 크기를 설정하는 명령어는 Limits이다.","o":["O","X"],"a":0,"qe":"In AutoCAD, the command that sets the paper size is Limits.","si":"AutoCAD හි කඩදාසි ප්‍රමාණය (drawing size) සකසන command එක Limits වේ."},{"q":"AutoCAD에서 Grid 명령은 화면상에서의 격자이며,  Snap 명령은 마우스를 이동할 때 지정한 격자간격으로만 이동하도록 하는 명령어 이다.","o":["O","X"],"a":0,"qe":"The Grid command shows a grid on screen; Snap makes the mouse move only in the set grid interval.","si":"Grid command එක තිරය මත ජාලකයක් පෙන්වයි; Snap command එක mouse එක යොදා ඇති ජාලක පරතරයට පමණක් චලනය වීමට සලස්වයි."},{"q":"AutoCAD에서 그래픽 커서를 수직/수평 방향으로만 움직이게 하는 명령은 ortho이며, F8 Key로도 ON/OFF가 가능하다.","o":["O","X"],"a":0,"qe":"The command that restricts the cursor to vertical/horizontal movement is ortho, toggled with F8.","si":"ග්‍රැෆික් cursor එක සිරස්/තිරස් දිශාවලට පමණක් චලනය කරන command එක ortho වන අතර F8 යතුරෙන්ද ON/OFF කළ හැක."},{"q":"용지의 크기를 설정하는 limits명령에서 서브 명령인 ON을 했을 때는 도면영역 안에서만 도면작성이 가능하고, OFF를 했을 때에는 도면영역 밖에도 도면작성이 가능하다.","o":["O","X"],"a":0,"qe":"In Limits, ON allows drawing only inside the drawing area; OFF also allows drawing outside it.","si":"Limits හි ON කළ විට drawing ප්‍රදේශය තුළ පමණක් ඇඳිය හැකි අතර OFF කළ විට ප්‍රදේශයෙන් පිටතද ඇඳිය හැක."}]},{"id":"c4","title":"04 Layer, trim, offset","b":1,"qs":[{"q":"도면층을 설정하는 명령어는 Layer이며, 단축키는 “LA”이다.","o":["O","X"],"a":0,"qe":"The command to set layers is Layer, shortcut 'LA'.","si":"layer සකසන command එක Layer වන අතර shortcut එක 'LA' වේ."},{"q":"AutoCAD에서 도면요소의 일부분을 삭제하는 명령어는 Trim이고, 단축키는 “TR”이다.","o":["O","X"],"a":0,"qe":"The command to delete part of a drawing element is Trim, shortcut 'TR'.","si":"AutoCAD හි drawing අංගයක කොටසක් මකන command එක Trim වන අතර shortcut එක 'TR' වේ."},{"q":"AutoCAD에서 도면요소를 이동복사 하는 명령어는 Offset이고, 단축키는 “O”이다.","o":["O","X"],"a":0,"qe":"The command to move-copy drawing elements (parallel copy) is Offset, shortcut 'O'.","si":"AutoCAD හි drawing අංග ගෙන ගොස් copy කරන (සමාන්තරව copy කරන) command එක Offset වන අතර shortcut එක 'O' වේ."},{"q":"AutoCAD의 도면층 설정에서 인쇄의 여부를 설정할 수 있다.","o":["O","X"],"a":0,"qe":"In AutoCAD layer settings, you can set whether a layer is plotted (printed).","si":"AutoCAD හි layer සැකසුම්වලදී මුද්‍රණය (print) කළ යුතුද නැද්ද යන්න සැකසිය හැක."}]},{"id":"c5","title":"05 Text","b":1,"qs":[{"q":"AutoCAD에서 문자를 삽입하는 명령어는 Text이며, 단축키는 “T”이다.","o":["O","X"],"a":0,"qe":"The command to insert text in AutoCAD is Text, shortcut 'T'.","si":"AutoCAD හි text ඇතුළත් කරන command එක Text වන අතර shortcut එක 'T' වේ."},{"q":"AutoCAD에서 문자를 수정하는 명령어는 ddedit 이며, 단축키는 “ED”이다.","o":["O","X"],"a":0,"qe":"The command to edit text in AutoCAD is ddedit, shortcut 'ED'.","si":"AutoCAD හි text සංස්කරණය කරන command එක ddedit වන අතර shortcut එක 'ED' වේ."},{"q":"특수문자 입력에서 ℃를 표현하려면, “%%dC”로 입력하면 된다.","o":["O","X"],"a":0,"qe":"To enter the ℃ symbol, type '%%dC'.","si":"℃ සංකේතය ඇතුළත් කිරීමට '%%dC' ලෙස ටයිප් කළ හැක."},{"q":"문자 쌓기에서 공차의 형식으로 변경하는 구분자 “ ^” 이다.","o":["O","X"],"a":0,"qe":"In text stacking, the separator that changes to tolerance format is '^'.","si":"text stacking හිදී tolerance ආකෘතියට වෙනස් කරන වෙන්කරන සංකේතය '^' වේ."}]},{"id":"c6","title":"06 Circle and arc","b":1,"qs":[{"q":"AutoCAD에서 원을 그리는 명령어는 circle 이며, 단축키는 “C”이다","o":["O","X"],"a":0,"qe":"The command to draw a circle in AutoCAD is circle, shortcut 'C'.","si":"AutoCAD හි රවුමක් ඇඳීමේ command එක circle වන අතර shortcut එක 'C' වේ."},{"q":"원을 그리는 명령어에서  2개의 도면요소에 접하고, 반지름 값을 입력하여 접원을 그릴 때 사용할 수 있는 원 그리기 옵션은 “TTR” 이다.","o":["O","X"],"a":0,"qe":"The circle option that is tangent to two elements and takes a radius value is 'TTR'.","si":"අංග දෙකකට ස්පර්ශ වන අතර අරය අගයක් ඇතුළත් කර රවුමක් ඇඳීමේදී භාවිත කළ හැකි විකල්පය 'TTR' වේ."},{"q":"원을 그리는 옵션으로 원의 중심점 지정하고 반지름 뿐만 아니라, 지름 값을 입력하여 원을 작성할 수도 있다.","o":["O","X"],"a":0,"qe":"A circle can be made by specifying the center and entering a diameter value as well as a radius.","si":"රවුමක කේන්ද්‍රය සඳහන් කර අරය පමණක් නොව විෂ්කම්භය (diameter) අගයක් ඇතුළත් කරද රවුමක් ඇඳිය හැක."},{"q":"AutoCAD에서 호을 그리는 명령어는 arc 이며, 단축키는 “A”이다.","o":["O","X"],"a":0,"qe":"The command to draw an arc in AutoCAD is arc, shortcut 'A'.","si":"AutoCAD හි චාපයක් (arc) ඇඳීමේ command එක arc වන අතර shortcut එක 'A' වේ."}]},{"id":"c7","title":"07 Osnap, ellipse, polygon, spline","b":1,"qs":[{"q":"AutoCAD에서 사용자가 원하는 도면요소의 정확한 지점을 지정할 수 있도록 설정하는 명령어는 osnap이며, 단축키는 “OS”이다.","o":["O","X"],"a":0,"qe":"The command that sets precise object snap points is osnap, shortcut 'OS'.","si":"drawing අංගයක නිවැරදි ලක්ෂ්‍යයක් සඳහන් කිරීමට සකසන command එක osnap වන අතර shortcut එක 'OS' වේ."},{"q":"타원을 그리는 명령어의 옵션은 중심점 / 축, 끝점 / 타원형 호가 있다.","o":["O","X"],"a":0,"qe":"Ellipse options are Center, Axis/End, and Elliptical arc.","si":"ඉලිප්සයක් (ellipse) ඇඳීමේ විකල්ප වන්නේ කේන්ද්‍රය (Center), අක්ෂය/අන්ත ලක්ෂ්‍ය (Axis, End) සහ ඉලිප්සීය චාපය (Elliptical arc) ය."},{"q":"정다각형을 그리는 명령어는 polygon이며, 단축키는 “POL”이다.","o":["O","X"],"a":0,"qe":"The command to draw a regular polygon is polygon, shortcut 'POL'.","si":"සවිධි බහුඅස්‍රයක් (regular polygon) ඇඳීමේ command එක polygon වන අතර shortcut එක 'POL' වේ."},{"q":"단면도의 절단선을 작성할 목적으로 사용되는 명령어는 spline이며, 단축키는 “SPL”이다.","o":["O","X"],"a":0,"qe":"The command used to draw the cutting line of a section view is spline, shortcut 'SPL'.","si":"හරස්කඩ දසුනක (section view) කැපුම් රේඛාව ඇඳීමට භාවිත කරන command එක spline වන අතර shortcut එක 'SPL' වේ."}]},{"id":"c8","title":"08 Section views","b":1,"qs":[{"q":"단면도는 보이지 않는 부분을 알기 쉽게 표시하기 위해서 절단면(cutting plan)으로 잘라,  물체의 내부 형상을 명확하게 표현하는 방법이다.","o":["O","X"],"a":0,"qe":"A section view cuts along a cutting plane to clearly show the object's hidden interior shape.","si":"හරස්කඩ දසුන (section view) යනු නොපෙනෙන කොටස් පහසුවෙන් පෙන්වීමට කැපුම් තලයකින් කපා වස්තුවේ අභ්‍යන්තර හැඩය පැහැදිලිව දැක්වීමේ ක්‍රමයයි."},{"q":"단면도의 종류에서 물체를  ½로 절단하여 표현하는 단면도를  전단면도라 한다.","o":["O","X"],"a":0,"qe":"A section view made by cutting the object in ½ is called a full section view.","si":"වස්තුව ½ කට කපා දක්වන හරස්කඩ දසුන සම්පූර්ණ හරස්කඩය (full section view) ලෙස හැඳින්වේ."},{"q":"단면도의 종류에서 물체의 ¼를 절단하여 표현하는 단면도를  반단면도라 한다.","o":["O","X"],"a":0,"qe":"A section view made by cutting away ¼ of the object is called a half section view.","si":"වස්තුවේ ¼ ක් කපා දක්වන හරස්කඩ දසුන අර්ධ හරස්කඩය (half section view) ලෙස හැඳින්වේ."},{"q":"단면도의 해칭에 사용되는 명령어는 hatch이며, 단축키는 “H”이다.","o":["O","X"],"a":0,"qe":"The command for hatching section views is hatch, shortcut 'H'.","si":"හරස්කඩ දසුන්වල hatching සඳහා භාවිත කරන command එක hatch වන අතර shortcut එක 'H' වේ."}]},{"id":"c9","title":"09 Move, copy, array","b":1,"qs":[{"q":"도면요소를 사용자가 원하는 정확한 지점으로 이동시키는 명령어는 move이고, 단축키는 “M”이다.","o":["O","X"],"a":0,"qe":"The command to move drawing elements to an exact point is move, shortcut 'M'.","si":"drawing අංග නිවැරදි ලක්ෂ්‍යයකට ගෙන යන command එක move වන අතර shortcut එක 'M' වේ."},{"q":"도면요소를 사용자가 원하는 정확한 지점으로 복사하는 명령어는 copy이고, 단축키는 “CO”이다.","o":["O","X"],"a":0,"qe":"The command to copy drawing elements to an exact point is copy, shortcut 'CO'.","si":"drawing අංග නිවැරදි ලක්ෂ්‍යයකට copy කරන command එක copy වන අතර shortcut එක 'CO' වේ."},{"q":"다중 배열을 하는 명령어는 array이며, 단축키는 “AR”이다.","o":["O","X"],"a":0,"qe":"The command for multiple arrays is array, shortcut 'AR'.","si":"බහු අනුපිළිවෙල (multiple array) සාදන command එක array වන අතර shortcut එක 'AR' වේ."},{"q":"다중 배열을 하는 명령어 원형으로 배열하는 서브 명령어는 “PO”이다.","o":["O","X"],"a":0,"qe":"The array sub-option for a circular layout is 'PO' (polar).","si":"array command එකේ වෘත්තාකාර (circular) ලෙස පෙළගැස්වීමේ උප විකල්පය 'PO' (polar) වේ."}]},{"id":"c10","title":"10 Mirror, rotate, scale","b":1,"qs":[{"q":"대칭이동 명령의 문자열이 거꾸로 작성되도록 설정하는 명령어는 mirrtext이고, 그 값은 “1”이다.","o":["O","X"],"a":0,"qe":"The system variable that makes mirrored text appear reversed is mirrtext, with the value '1'.","si":"දර්පණ පිළිබිඹු කළ විට text ප්‍රතිවිරුද්ධව පෙනීමට සලස්වන system variable එක mirrtext වන අතර එහි අගය '1' වේ."},{"q":"선택한 도면요소를 지정 축을 중심으로 대칭 이동시키거나 대칭 복사하는 명령어는 mirror이고, 단축키는 “MI”이다.","o":["O","X"],"a":0,"qe":"The command to mirror or mirror-copy elements about an axis is mirror, shortcut 'MI'.","si":"තෝරාගත් drawing අංග අක්ෂයක් වටා පිළිබිඹු කරන හෝ පිළිබිඹු copy කරන command එක mirror වන අතර shortcut එක 'MI' වේ."},{"q":"선택한 도면요소를 지정 점을 중심으로 지정 각도만큼 회전시키는 명령어는 rotate이고, 단축키는 “RO”이다.","o":["O","X"],"a":0,"qe":"The command to rotate elements by an angle about a point is rotate, shortcut 'RO'.","si":"තෝරාගත් අංග ලක්ෂ්‍යයක් වටා දී ඇති කෝණයකින් කරකවන command එක rotate වන අතර shortcut එක 'RO' වේ."},{"q":"선택한 도면요소를 지정 배율로  확대하거나 축소하는 명령어는  scale이며, 단축키는 “SC”이다.","o":["O","X"],"a":0,"qe":"The command to enlarge or reduce elements by a scale factor is scale, shortcut 'SC'.","si":"තෝරාගත් අංග දී ඇති scale අගයකින් විශාල හෝ කුඩා කරන command එක scale වන අතර shortcut එක 'SC' වේ."}]},{"id":"c11","title":"11 Chamfer, fillet, extend, lengthen","b":1,"qs":[{"q":"도면요소의 모서리를 비스듬하게 깎는 명령어는 chamfer이고, 단축키는 “CHA”이다.","o":["O","X"],"a":0,"qe":"The command to bevel the corner of elements is chamfer, shortcut 'CHA'.","si":"drawing අංගයක මුල්ලේ දාරය ඇල කර කපන (bevel) command එක chamfer වන අතර shortcut එක 'CHA' වේ."},{"q":"도면요소의 모서리를 둥글게 깎는 명령어는 fillet이고, 단축키는 “F”이다.","o":["O","X"],"a":0,"qe":"The command to round the corner of elements is fillet, shortcut 'F'.","si":"drawing අංගයක මුල්ල රවුම් කර කපන command එක fillet වන අතර shortcut එක 'F' වේ."},{"q":"도면요소를 다른 도면 요소의 모서리와 만나도록 객체를 명령어는  extend이며, 단축키는 “EX”이다.","o":["O","X"],"a":0,"qe":"The command to extend an object to meet another element's edge is extend, shortcut 'EX'.","si":"වස්තුවක් වෙනත් අංගයක දාරයට හමුවන ලෙස දීර්ඝ කරන command එක extend වන අතර shortcut එක 'EX' වේ."},{"q":"도면요소의 길이를 변경하는 명령어 중 증분값, 퍼센트, 합계 등으로  길이를 변경하는 명령어는 lengthen이고, 단축키는 “LEN”이다.","o":["O","X"],"a":0,"qe":"The command that changes length by increment, percent, or total is lengthen, shortcut 'LEN'.","si":"වැඩිවීම (increment), ප්‍රතිශතය (percent) හෝ මුළු දිග (total) මගින් දිග වෙනස් කරන command එක lengthen වන අතර shortcut එක 'LEN' වේ."}]},{"id":"c12","title":"12 Dimensioning","b":1,"qs":[{"q":"치수의 유형을 설정하는 명령어는 dimstyle이고, 단축키는 “D”이다.","o":["O","X"],"a":0,"qe":"The command that sets the dimension style is dimstyle, shortcut 'D'.","si":"dimension ශෛලිය (dimension style) සකසන command එක dimstyle වන අතර shortcut එක 'D' වේ."},{"q":"치수기입에서 선형은 수평 또는 수직으로의 선형 치수만 가능하고 사선의 치수선 기입은 불가능하다.","o":["O","X"],"a":1,"qe":"In dimensioning, linear dimensions can only be horizontal or vertical, and diagonal dimension lines cannot be made.","si":"මානකරණයේදී linear dimension සිරස් හෝ තිරස් පමණක් කළ හැකි අතර ඇල රේඛා සඳහා dimension රේඛා ඇඳීම කළ නොහැක."},{"q":"단일 명령 세션 내에서 여러 유형의 치수를 작성할 때 사용하는 명령어는 “DIM”이다.","o":["O","X"],"a":0,"qe":"The command for creating several dimension types in one command session is 'DIM'.","si":"එක් command session එකක් තුළ dimension වර්ග කිහිපයක් සෑදීමට භාවිත කරන command එක 'DIM' වේ."},{"q":"지시선 치수를 작성하는 명령어는 “leader이고, 단축키는 “LE”이다.","o":["O","X"],"a":0,"qe":"The command for leader dimensions is leader, shortcut 'LE'.","si":"leader dimension සෑදීමේ command එක leader වන අතර shortcut එක 'LE' වේ."}]},{"id":"c13","title":"13 Tolerances","b":1,"qs":[{"q":"“dimtol” 명령어로 치수공차를 기입할 경우 + 공차값을 입력하는 명령어는 dimtp, - 공차값을 입력하는 명령어는 dimtm이다.","o":["O","X"],"a":0,"qe":"When entering dimension tolerances with 'dimtol', the command for the + tolerance value is dimtp and for the − tolerance value is dimtm.","si":"'dimtol' මඟින් dimension tolerance ඇතුළත් කරන විට, + tolerance අගය ඇතුළත් කරන command එක dimtp වන අතර − tolerance අගය ඇතුළත් කරන command එක dimtm වේ."},{"q":"치수공차를 입력하는 방법으로 “DDEDIT”에서 스텍을 이용하여 치수공차를 입력할 수도 있다.","o":["O","X"],"a":0,"qe":"Dimension tolerances can also be entered by using stacking in 'DDEDIT'.","si":"'DDEDIT' තුළ stacking භාවිතයෙන්ද dimension tolerance ඇතුළත් කළ හැක."},{"q":"기하공차를 작성하는 명령어는 “tolerance”이고, 단축키는 “TOL”이다.","o":["O","X"],"a":0,"qe":"The command to create geometric tolerances is 'tolerance', shortcut 'TOL'.","si":"geometric tolerance (ජ්‍යාමිතික ඉවසුම්) සෑදීමේ command එක 'tolerance' වන අතර shortcut එක 'TOL' වේ."},{"q":"치수공차는 “dimtol” 명령어로 ON/OFF할 수 있다.","o":["O","X"],"a":0,"qe":"Dimension tolerances can be turned ON/OFF with the 'dimtol' command.","si":"dimension tolerance 'dimtol' command එකෙන් ON/OFF කළ හැක."}]},{"id":"c14","title":"14 CAD functions, coordinates, Pan","b":1,"qs":[{"q":"CAD에서 사용되는 좌표 중에서 최종점에서 일정한 거리와 각도로서 표현하는 좌표계는 상대극좌표계 이다.","o":["O","X"],"a":0,"qe":"Among the coordinates used in CAD, the system that expresses a distance and angle from the last point is the relative polar coordinate system.","si":"CAD හි භාවිත වන coordinate අතුරින්, අවසාන ලක්ෂ්‍යයේ සිට නිශ්චිත දුරක් සහ කෝණයක් මගින් දක්වන පද්ධතිය relative polar coordinate පද්ධතියයි."},{"q":"CAD 소프트웨어의 기본 기능은 1) 요소 작성 기능, 2) 요소 변환 기능, 3) 요소 편집 기능, 4) 도면화 기능, 5) 디스플레이 제어 기능, 6) 데이터 관리 기능, 7) 특성 해석 기능, 8) 플로팅 기능 등이 있다","o":["O","X"],"a":0,"qe":"The basic functions of CAD software are: 1) element creation, 2) element transformation, 3) element editing, 4) drafting, 5) display control, 6) data management, 7) property analysis, 8) plotting.","si":"CAD මෘදුකාංගයේ මූලික ක්‍රියාකාරකම් වන්නේ: 1) අංග නිර්මාණය, 2) අංග පරිවර්තනය, 3) අංග සංස්කරණය, 4) drafting, 5) display පාලනය, 6) දත්ත කළමනාකරණය, 7) ගුණ විශ්ලේෂණය, 8) plotting ය."},{"q":"일반적으로 CAD 소프트웨어기능의 기본적인 기능으로 가공정보 제어기능이 포함된다.","o":["O","X"],"a":1,"qe":"A machining-information control function is generally included among the basic functions of CAD software.","si":"සාමාන්‍යයෙන් CAD මෘදුකාංගයේ මූලික ක්‍රියාකාරකම් අතර යන්ත්‍රකරණ තොරතුරු පාලන (machining information control) ක්‍රියාකාරකම ඇතුළත් වේ."},{"q":"CAD의 용어 중 “Pan” 기능은 도면의 다른 영역을 보기 위해 디스플레이 원도우를 이동시킬 때 사용된다.","o":["O","X"],"a":0,"qe":"In CAD, the 'Pan' function is used to move the display window to view another area of the drawing.","si":"CAD හි 'Pan' ක්‍රියාකාරකම drawing එකේ වෙනත් ප්‍රදේශයක් බැලීමට display කවුළුව චලනය කිරීමට භාවිත කෙරේ."}]}],"Organization And management":[{"id":"o1","title":"01 Leadership and OB history","b":1,"qs":[{"q":"Integrity and credibility are the key leadership skills for managing people in a global economy in the 21st century?","o":["True","False"],"a":0,"si":"21st century global economy එකේ people manage කිරීමට integrity සහ credibility ප්‍රධාන leadership skills වේ."},{"q":"In the evolution of organizational behavior and work culture in the United States, the first phase between 1980s to 1940s is mainly about Human Relations?","o":["True","False"],"a":1,"si":"United States හි organizational behavior සහ work culture පරිණාමයේ 1980s~1940s පළමු අදියර ප්‍රධාන වශයෙන් Human Relations ගැනයි."}]},{"id":"o2","title":"02 Social capital and CSR","b":1,"qs":[{"q":"Lack of financial capital is among the top reasons that nine out of ten startups fail?","o":["True","False"],"a":1,"si":"Startups දහයෙන් නවයක් අසාර්ථක වීමේ ප්‍රධාන හේතු අතර financial capital නොමැති වීම ඇතුළත් වේ."},{"q":"Corporate Social Responsibility refers to the responsibility of enterprises for their impacts on society, making companies socially accountable to themselves, stakeholders, and the public?","o":["True","False"],"a":0,"si":"CSR යනු සමාජයට enterprises වල බලපෑම් පිළිබඳ වගකීමයි; එමඟින් companies තමන්ටත්, stakeholders ලාටත්, මහජනතාවටත් සමාජීය වශයෙන් වගවීමට බැඳේ."}]},{"id":"o3","title":"03 Organizational culture","b":1,"qs":[{"q":"Organizational culture refers to a system of shared assumptions, values, and beliefs that show people what is appropriate and inappropriate behavior?","o":["True","False"],"a":0,"si":"Organizational culture යනු කුමන හැසිරීම සුදුසු/නුසුදුසු දැයි පෙන්වන shared assumptions, values, beliefs පද්ධතියකි."},{"q":"Artefacts is any overt, visible, describable aspects of the organization such as branding and logos, office design, dress code, policies and tools?","o":["True","False"],"a":0,"si":"Artefacts යනු branding, logos, office design, dress code, policies, tools වැනි organization එකේ දැකිය හැකි, විස්තර කළ හැකි අංග වේ."}]},{"id":"o4","title":"04 Socialization and culture change","b":1,"qs":[{"q":"Social insider is an employee who has successfully transitioned from an outsider to a fully integrated member of a workplace network as the core outcome of organizational management?","o":["True","False"],"a":0,"si":"Social insider යනු outsider කෙනෙකු workplace network එකේ සම්පූර්ණයෙන් ඒකාබද්ධ සාමාජිකයෙකු බවට සාර්ථකව මාරු වූ employee කෙනෙකි."},{"q":"Stating the organizational philosophy, mission, vision are the most important parts in the process of culture change?","o":["True","False"],"a":0,"si":"Culture change process එකේ organizational philosophy, mission, vision ප්‍රකාශ කිරීම වඩාත්ම වැදගත් කොටස් වේ."}]},{"id":"o5","title":"05 Global mindset and cultures","b":1,"qs":[{"q":"Individualist cultures rely on group consultation and consensus?","o":["True","False"],"a":1,"si":"Individualist cultures group consultation සහ consensus මත රඳා පවතී."},{"q":"Intellectual capital is of the three important dimensions for having a global mindset?","o":["True","False"],"a":0,"si":"Global mindset එක සඳහා වැදගත් dimensions තුනෙන් එකක් intellectual capital වේ."}]},{"id":"o6","title":"06 Cultural paradox, asocial","b":1,"qs":[{"q":"Cultural Paradox is the ability to understand, interpret, and adapt effectively to people from different cultural backgrounds?","o":["True","False"],"a":1,"si":"Cultural Paradox යනු විවිධ cultural background ඇති අය තේරුම්ගෙන, අර්ථ නිරූපණය කර, effective ලෙස අනුගත වීමේ හැකියාවයි."},{"q":"Asocial means having a lack of motivation or desire to engage in social interaction, along with a strong preference for solitary activities?","o":["True","False"],"a":0,"si":"Asocial යනු social interaction සඳහා අභිප්‍රේරණය/ආශාව අඩුකම සහ තනිව කරන ක්‍රියාකාරකම් කැමති වීමයි."}]},{"id":"o7","title":"07 Perception","b":1,"qs":[{"q":"When the information is selected and translated into a mental representation that the brain can understand is called Encoding and Simplification?","o":["True","False"],"a":0,"si":"Information තෝරාගෙන brain එකට තේරෙන mental representation එකක් බවට පරිවර්තනය කිරීම Encoding and Simplification ලෙස හැඳින්වේ."},{"q":"Social Perception is the idea of recognizing and understanding the emotions of others in your environment?","o":["True","False"],"a":0,"si":"Social Perception යනු ඔබේ පරිසරයේ අන් අයගේ emotions හඳුනාගෙන තේරුම්ගැනීමයි."}]},{"id":"o8","title":"08 Attribution and personality","b":1,"qs":[{"q":"External attributions explains that link an action to a person's inner traits, abilities, or motives.","o":["True","False"],"a":1,"si":"External attributions මගින් ක්‍රියාවක් පුද්ගලයෙකුගේ inner traits, abilities, motives සමඟ සම්බන්ධ කෙරේ."},{"q":"Personality is your age, gender, sexual orientation, physical ability, ethnicity, and race.","o":["True","False"],"a":1,"si":"Personality යනු ඔබේ age, gender, sexual orientation, physical ability, ethnicity, race වේ."}]},{"id":"o9","title":"09 Self-concept and self-monitoring","b":1,"qs":[{"q":"Self-Concept answers the question, \"How should I act here?\"","o":["True","False"],"a":1,"si":"Self-Concept මගින් 'How should I act here?' ප්‍රශ්නයට පිළිතුරු ලැබේ."},{"q":"Self-Monitoring answers the question, \"Can I do this?\"","o":["True","False"],"a":1,"si":"Self-Monitoring මගින් 'Can I do this?' ප්‍රශ්නයට පිළිතුරු ලැබේ."}]},{"id":"o10","title":"10 Emotional intelligence, abilities","b":1,"qs":[{"q":"Self-awareness, self-regulation, empathy, and social skills are the four pillars of emotional intelligence?","o":["True","False"],"a":0,"si":"Self-awareness, self-regulation, empathy, social skills යනු emotional intelligence හි pillars හතරයි."},{"q":"Spatial visualization remember pairs of ideas and facts?","o":["True","False"],"a":1,"si":"Spatial visualization යනු ideas සහ facts යුගල මතක තබාගැනීමයි."}]},{"id":"o11","title":"11 Motivation and Maslow","b":1,"qs":[{"q":"Employee motivation rests on a combination of baseline financial security, intrinsic psychological fulfillment, and a supportive workplace culture?","o":["True","False"],"a":0,"si":"Employee motivation රඳා පවතින්නේ මූලික financial security, intrinsic psychological fulfillment සහ supportive workplace culture යන දෙවල් එකතුවෙනි."},{"q":"The second stage of Maslow's Need Hierarchy Theory is about Love and Belonging?","o":["True","False"],"a":1,"si":"Maslow ගේ Need Hierarchy Theory හි දෙවන අදියර Love and Belonging ගැනයි."}]},{"id":"o12","title":"12 Intrinsic motivation, job satisfaction","b":1,"qs":[{"q":"Intrinsic motivation comes from personal satisfaction or the enjoyment of a task.","o":["True","False"],"a":0,"si":"Intrinsic motivation පැමිණෙන්නේ පෞද්ගලික තෘප්තිය හෝ task එකක රසවිඳීමෙනි."},{"q":"Job satisfaction is an employee's overall sense of contentment, fulfillment, and positive emotional alignment with their career.","o":["True","False"],"a":0,"si":"Job satisfaction යනු employee කෙනෙකුගේ career එක පිළිබඳ සමස්ත සතුට, සම්පූර්ණත්වය සහ ධනාත්මක හැඟීම් ගැළපීමයි."}]},{"id":"o13","title":"13 Valence and equity","b":1,"qs":[{"q":"Valence is the belief that successful performance will lead to a specific outcome or reward?","o":["True","False"],"a":1,"si":"Valence යනු සාර්ථක performance එකක් නිශ්චිත outcome හෝ reward එකකට මග පාදන බවට විශ්වාසයයි."},{"q":"In Adam's Equity Theory of Motivation, the employee calculate the ratio of what they put into their job versus what they get out of it, and then compare this ratio to their peers or colleagues?","o":["True","False"],"a":0,"si":"Adam's Equity Theory හි employee තම job එකට දෙන දේ සහ ලබන දේ අතර අනුපාතය ගණනය කර සගයන් සමඟ සසඳයි."}]},{"id":"o14","title":"14 Goal setting","b":1,"qs":[{"q":"Motivation through goal setting has been developed primarily by psychologists Edwin Latham and Gary Locke?","o":["True","False"],"a":1,"si":"Goal setting හරහා motivation වර්ධනය කිරීම මූලික වශයෙන් psychologists Edwin Latham සහ Gary Locke විසින් සිදුකරන ලදී."},{"q":"Leaders must break complex goals down into smaller, manageable sub-targets so the employee stays confident?","o":["True","False"],"a":0,"si":"Complex goals කුඩා, කළමනාකරණය කළ හැකි sub-targets වලට කඩා දැමිය යුතුයි, එවිට employee ට විශ්වාසය පවතී."}]}]};
let aid=0;const getSubs=()=>{const r={};for(const k in BUILTIN){const L=BUILTIN[k];let a=[...L];if(!L.some(e=>/^All /.test(e.title))){const seen=new Set(),qs=[];L.forEach(e=>e.qs.forEach(x=>{const key=x.q+'|'+x.o.join('|');if(!seen.has(key)){seen.add(key);qs.push(x)}}));a=[{id:'all'+(++aid%1)+Object.keys(BUILTIN).indexOf(k),title:'All questions ('+qs.length+')',qs,b:1,lt:L[0].lt},...L]}r[k]=a}for(const k in S.subs)r[k]=[...(r[k]||[]),...S.subs[k]];return r};
const enOn=()=>S.cfg.en!==false;
const tr=(x,d)=>{let h='';const hide=Q.ex.lt&&!d;if(enOn()&&x.qe&&!hide)h+=`<div class="en">${esc(x.qe)}</div>`;if(S.cfg.si&&x.si&&!hide)h+=`<div class="en">${esc(x.si)}</div>`;return h};
const tgl=()=>`<div class="row" style="margin:0 0 .6rem">${[['en','English',enOn()],['si','සිංහල',!!S.cfg.si]].map(([k,l,on])=>`<button class="${on?'sel':''}" data-a="tgl" data-v="${k}">${l}: ${on?'ON':'OFF'}</button>`).join('')}</div>`;
let DP=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;R()});addEventListener('appinstalled',()=>{DP=null;R()});
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const inst=f=>{if(standalone()||(!f&&localStorage.getItem('ep_inst')))return '';
 const how=isIOS()?'On iPhone/iPad open this page in <b>Safari</b>, tap the <b>Share</b> button (square with an arrow), then <b>Add to Home Screen</b>.':'In Chrome tap the <b>⋮ menu</b>, then <b>Install app</b> or <b>Add to Home screen</b>.';
 return `<div class="card"><b>Add to home screen</b><p class="m">Open the app with one tap, like a normal app. No need to paste the link again.</p>${DP?'<button class="pri full" data-a="install">Install app</button>':`<p>${how}</p>`}${f?'<button class="full" data-a="share">Share app link</button>':'<button class="full" data-a="hide">Not now</button>'}</div>`};
const A={
  go:v=>go(v),
  install(){DP.prompt();DP.userChoice.finally(()=>{DP=null;R()})},
  hide(){localStorage.setItem('ep_inst','1');R()},
  async share(){const u=location.href.split('#')[0].split('?')[0];try{if(navigator.share)await navigator.share({title:'Exam Practice',url:u});else{await navigator.clipboard.writeText(u);alert('Link copied')}}catch(e){}},
  tgl(v){S.cfg[v]=v=='en'?!enOn():!S.cfg.si;save();R()},
  async unlock(){
    if(!window.crypto||!crypto.subtle)return alert('Please open the app from its https link.');
    if(await sha($('#pw').value)===PW){localStorage.setItem('ep_ok',PW);R()}else alert('Wrong password');
  },
  lock(){localStorage.removeItem('ep_ok');go('exsub')},
  async up(){if(!ok())return;
    const sub=$('#sub').value||$('#ns').value.trim(),f=$('#file').files[0];
    if(!sub||!f)return alert('Choose a subject and a text file.');
    const qs=parse(await f.text());
    if(!qs.length)return alert('No questions found in this file.');
    D={sub,title:$('#ti').value.trim()||f.name.replace(/\.txt$/i,''),qs,i:0};go('answers');
  },
  setans(v){D.qs[D.i].a=+v;R()},
  prev(){D.i--;R()},next(){D.i++;R()},
  async finish(){if(!ok())return;
    if(D.edit){save();Sub=D.sub;return go('exlist')}
    if(S.cfg.key){busy('Translating to English…');
      try{await translate(D.qs)}catch(e){alert('Translation failed: '+e.message+'\nSaved in Korean only. You can retry with the Translate button.')}}
    (S.subs[D.sub]=S.subs[D.sub]||[]).push({id:Date.now(),title:D.title,qs:D.qs,date:new Date().toISOString()});
    save();Sub=D.sub;go('exlist');
  },
  subj(v){Sub=v;go('exlist')},
  start(w){const ex=find(w)||Q.ex;Q={ex,i:0,sel:[]};go('quiz')},
  edit(w){if(!ok())return;const ex=find(w);D={sub:Sub,title:ex.title,qs:ex.qs,i:0,edit:1};go('answers')},
  async tr(w){if(!ok())return;
    if(!S.cfg.key)return alert('Add your OpenRouter key in Settings first.');
    busy('Translating to English…');
    try{await translate(find(w).qs);save()}catch(e){alert('Translation failed: '+e.message)}
    go('exlist');
  },
  del(w){if(!ok())return;if(confirm('Delete this exam?')){S.subs[Sub]=S.subs[Sub].filter(e=>e.id!=w);if(!S.subs[Sub].length)delete S.subs[Sub];save();go(S.subs[Sub]?'exlist':'exsub')}},
  pick(v){if(Q.sel[Q.i]!=null)return;Q.sel[Q.i]=+v;R()},
  nq(){if(Q.i<Q.ex.qs.length-1){Q.i++;R();scrollTo(0,0)}else go('result')},
  cfg(){S.cfg.key=$('#key').value.trim();S.cfg.model=$('#model').value.trim()||'anthropic/claude-sonnet-4.5';save();alert('Saved')},
  fs(v){S.cfg.fs=Math.min(30,Math.max(16,S.cfg.fs+ +v));save();fs();R()},
  exp(){
    const b=new Blob([JSON.stringify({subs:S.subs})],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='exam-backup.json';a.click();
  },
  imp(){$('#bk').click()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b.dataset.v??b.dataset.w,b.dataset.w)});
document.addEventListener('change',async e=>{
  if(e.target.id=='sub')$('#ns').style.display=e.target.value?'none':'block';
  if(e.target.id=='bk'){try{const j=JSON.parse(await e.target.files[0].text());if(j.subs){S.subs=j.subs;save();alert('Restored');go('exsub')}}catch(x){alert('Invalid backup file')}}
});
R();
</script></body></html>
